name: APK bauen

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Aktuelle Filterlisten mitliefern
        run: bash scripts/fetch-assets.sh

      - name: Signaturschluessel aus GitHub-Secrets
        env:
          KEYSTORE_B64: ${{ secrets.SV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/streamview.jks"
            echo "SV_KEYSTORE_FILE=$RUNNER_TEMP/streamview.jks" >> "$GITHUB_ENV"
            echo "SIGNED=ja" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein Signaturschluessel hinterlegt."
            echo "SIGNED=nein" >> "$GITHUB_ENV"
          fi

      - name: Unit-Tests
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest --no-daemon --stacktrace

      - name: APK bauen
        env:
          SV_KEYSTORE_PASSWORD: ${{ secrets.SV_KEYSTORE_PASSWORD }}
          SV_KEY_ALIAS: ${{ secrets.SV_KEY_ALIAS }}
          SV_KEY_PASSWORD: ${{ secrets.SV_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk StreamViewTV.apk
          ls -la StreamViewTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StreamViewTV-apk
          path: |
            StreamViewTV.apk
            app/build/reports/tests/

      - name: Als Release veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: StreamView TV Build ${{ github.run_number }}
          body: |
            Signiert: ${{ env.SIGNED }}
            Download: https://github.com/${{ github.repository }}/releases/latest/download/StreamViewTV.apk
          files: StreamViewTV.apk
          make_latest: true
