plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Signatur: aus Umgebungsvariablen (GitHub-Secrets) oder lokaler keystore.properties.
// Der Schlüssel selbst liegt NIE im Repository.
def ksProps = new Properties()
def ksPropsFile = rootProject.file('keystore.properties')
if (ksPropsFile.exists()) ksPropsFile.withInputStream { ksProps.load(it) }
def ksFile = System.getenv('SV_KEYSTORE_FILE') ?: ksProps.getProperty('storeFile')
def ksPassword = System.getenv('SV_KEYSTORE_PASSWORD') ?: ksProps.getProperty('storePassword')
def ksAlias = System.getenv('SV_KEY_ALIAS') ?: ksProps.getProperty('keyAlias')
def ksKeyPassword = System.getenv('SV_KEY_PASSWORD') ?: ksProps.getProperty('keyPassword') ?: ksPassword
def hasReleaseKey = ksFile != null && new File(ksFile.toString()).exists() && ksPassword && ksAlias

android {
    namespace 'de.streamview.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'de.streamview.tv'
        minSdk 25          // Fire OS 6 und 7 (Android 7.1 / 9)
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(ksFile)
                storePassword ksPassword
                keyAlias ksAlias
                keyPassword ksKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // Filterlisten sind Text – unkomprimiert schneller lesbar wäre größer; Standard (komprimiert) beibehalten.
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.annotation:annotation-experimental:1.4.1'

    testImplementation 'junit:junit:4.13.2'
}
